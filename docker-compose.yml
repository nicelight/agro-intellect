services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: agro
      POSTGRES_PASSWORD: agro_dev
      POSTGRES_DB: agro_intellect
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agro -d agro_intellect"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
