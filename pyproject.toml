[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agro-intellect"
version = "0.1.0"
description = "Agro Intellect local modular monolith baseline"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "sqlalchemy>=2.0",
  "pydantic>=2",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "argon2-cffi>=23.1",
  "agno>=1.7",
  "openai>=1.0",
  "google-genai>=1.0",
]

[project.optional-dependencies]
test = [
  "httpx>=0.28",
  "pytest>=9",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"
markers = [
  "real_model: credentialed external-provider smoke tests",
]
